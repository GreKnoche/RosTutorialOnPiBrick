services:
  agent:
    build:
      context: ..
      dockerfile: pi-brick/docker/Dockerfile
      args:
        WITH_BRICKPI3: "1"
    image: pibrick:local
    network_mode: host
    ipc: host
    restart: unless-stopped
    devices:
      - /dev/spidev0.1
      - /dev/gpiomem
    env_file:
      - ../shared/ros.env
    environment:
      ROS_STATIC_PEERS: ${ROS_STATIC_PEERS:-}

  mock:
    build:
      context: ..
      dockerfile: pi-brick/docker/Dockerfile
      args:
        WITH_BRICKPI3: "0"
    image: pibrick:mock
    network_mode: host
    ipc: host
    profiles: ["mock"]
    env_file:
      - ../shared/ros.env
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash
      && source /ws/install/setup.bash
      && ros2 launch brick_hw brick.launch.py mock:=true"
