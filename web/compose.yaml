services:
  web:
    build:
      context: ..
      dockerfile: web/docker/Dockerfile
    image: pibrick-web:local
    network_mode: host
    env_file:
      - ../shared/ros.env
    environment:
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - NEXT_PUBLIC_ROBOT_API=http://127.0.0.1:8000
    volumes:
      - ../companion/src/brick_lessons/brick_lessons:/ws/companion/src/brick_lessons/brick_lessons
      - ../companion/src/brick_nav/behavior_trees:/ws/companion/src/brick_nav/behavior_trees:ro
      - ../web_frontend:/ws/web_frontend
      - web_frontend_modules:/ws/web_frontend/node_modules

volumes:
  web_frontend_modules:
