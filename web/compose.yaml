services:
  web:
    build:
      context: ..
      dockerfile: web/docker/Dockerfile
    image: pibrick-web:local
    network_mode: host
    env_file:
      - ../shared/ros.env
    environment:
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    volumes:
      - ../companion/src/brick_lessons/brick_lessons:/ws/companion/src/brick_lessons/brick_lessons
