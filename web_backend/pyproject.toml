[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-backend"
version = "0.1.0"
description = "HTTP door that publishes a timed /wheel_speeds stream."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
web-backend = "main:main"

[tool.setuptools]
py-modules = ["app", "bridge", "drive", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:launch_testing -p no:launch_ros"
