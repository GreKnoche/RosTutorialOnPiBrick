services:
  gazebo:
    build:
      context: ..
      dockerfile: gazebo/docker/Dockerfile
    image: pibrick-gazebo:local
    user: "1000:1000"
    group_add:
      - "44"
      - "992"
    network_mode: host
    ipc: host
    env_file:
      - localhost.env
      - ../shared/ros.env
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=${XAUTHORITY}
      - HOME=/tmp
      - XDG_RUNTIME_DIR=/tmp/runtime-ev3
      - QT_X11_NO_MITSHM=1
      - GZ_VERSION=harmonic
      - WORLD=${WORLD:-relief}
      - BRICK_CAMERA_YAML=/ws/camera.yaml
    devices:
      - /dev/dri
    volumes:
      - ./src:/ws/src
      - ../shared/brick_math:/ws/src/brick_math
      - ../brick/brick_core:/ws/src/brick_core
      - ../brick/brick_interfaces:/ws/src/brick_interfaces
      - ../camera_lidar:/ws/src/camera_lidar
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY}:${XAUTHORITY}:ro
      - ../shared/camera.yaml:/ws/camera.yaml:ro
    stdin_open: true
    tty: true
    command: >
      bash -lc "mkdir -p -m 0700 /tmp/runtime-ev3 && mkdir -p /tmp/build /tmp/install /tmp/log
      && source /opt/ros/jazzy/setup.bash
      && colcon --log-base /tmp/log build --symlink-install --build-base /tmp/build --install-base /tmp/install
      && source /tmp/install/setup.bash
      && ros2 launch brick_gz_bringup compare.launch.py world:=$${WORLD}"
