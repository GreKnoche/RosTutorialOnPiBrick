# Educator-style EV3 differential drive on a BrickPi3. Measure these on your build.
wheel_radius_m: 0.0277
wheel_separation_m: 0.1103
ticks_per_revolution: 360.0
max_linear_m_s: 0.15
max_angular_rad_s: 1.2
caster_offset_m: -0.055

# BrickPi3 motor ports A–D, sensor ports 1–4.
ports:
  left_motor: A
  right_motor: D
  gyro: "3"
  ultrasonic: "2"

frames:
  odom: odom
  base_link: base_link
  gyro: gyro_link
  ultrasonic: ultrasonic_link
