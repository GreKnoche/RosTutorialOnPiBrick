# Grayscale lane camera on top of the EV3 brick, looking forward (+X).
# Placeholder until the real lens and focus are measured.
# sim.launch rewrites the Gazebo sensor from this file.
# tutorial.launch rewrites the URDF mount from this file.
# ROS topic names must match gazebo/src/brick_gz_bringup/config/bridge.yaml.
encoding: mono8
width: 320
height: 240
update_hz: 10
# Horizontal field of view in radians (~60 deg).
fov_horizontal_rad: 1.047
near_m: 0.05
far_m: 4.0

# Mount relative to base_link. pitch_rad replaces the pitch component of rpy.
# Positive pitch_rad tilts the optical axis down.
xyz: [0.03, 0.0, 0.072]
rpy: [0.0, 0.0, 0.0]
pitch_rad: 0.45

frames:
  camera: camera_link
  optical: camera_optical_frame

topics:
  image: /camera/image_raw
  info: /camera/camera_info
