name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install fastapi "uvicorn>=0.27" "websockets>=12" "pytest>=8" "httpx>=0.27" pyyaml
      - name: Run unit tests
        run: ./scripts/test-python.sh

  camera-lidar:
    name: camera_lidar tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pytest>=8" numpy opencv-python-headless
      - name: Run camera_lidar tests
        working-directory: camera_lidar
        run: python -m pytest

  frontend:
    name: Frontend smoke tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web_frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npm test
